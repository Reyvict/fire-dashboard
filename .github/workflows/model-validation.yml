name: FIRE model validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  retirement-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check retirement-engine.js
          node --check app.js
      - name: Financial model tests
        run: node tests/retirement-engine.test.js
