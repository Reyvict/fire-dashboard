name: FIRE model validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  retirement-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tests/retirement-engine.test.js
