name: FIRE model validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  retirement-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check retirement-engine.js
          node --check app.js
          node --check retirement-worker.js
          node --check retirement-client.js
      - name: Financial model tests
        run: npm test
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser regression checks
        run: npm run test:browser
